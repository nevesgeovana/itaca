# Config for the kit's check_shipped_surface.py (kit 0.2.7, guard 1 of
# INC-20260729-0854-shared). The RULE and its tokens live in the kit
# body, deliberately: a token spelled here would ship in the sdist and
# make this file the one file able to defeat the rule, which is exactly
# what an earlier implementation did. What lives here is only what
# genuinely differs between repositories.
#
# The exemptions below are the ones DD-41 recorded, carried over
# unchanged from tests/identifiers.py, which is the module the kit
# promoted. They are files whose identifier is AUTHORSHIP: naming the
# author is what they are for.

exempt-path: LICENSE
exempt-path: CITATION.cff
exempt-path: README.md
exempt-path: CHANGELOG.md
exempt-path: CLAUDE.md
exempt-path: pyproject.toml

# The decision record itself. The SRS, the decision log, the question
# log and the execution plans all name who decided what.
exempt-tree: docs/

# Floors. These name files the scan MUST have read, so that a boundary
# reporting a clean artifact cannot mean it opened almost nothing. They
# are assertions about what was SCANNED, never about what was present in
# a namelist: that distinction is the incident.
#
# The wheel floor is the package module that carries a user identity by
# design, so it is the file a narrowed scan would most want to skip.
wheel-floor: itaca/core/provenance.py

# The sdist floor names two distinct top-level directories, which the
# loader requires. The second is not decoration: BRF-048 shipped its
# fourteen occurrences because the guard looked at the package directory
# while the sdist carries the whole tracked tree, and
# tests/core/test_provenance_modes.py is the file that actually held the
# identifier at that commit.
sdist-floor: itaca/core/provenance.py
sdist-floor: tests/core/test_provenance_modes.py
