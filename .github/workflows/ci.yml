# Continuous integration (REQ-95): ruff check, ruff format --check,
# mypy --strict on the public API, pytest with the 90 percent coverage
# gate (REQ-75). Tests run against the minimum and the latest compatible
# dependency versions (REQ-83).
#
# CI and Release now call the SAME reusable gate, which is what REV-001
# asked for in ITACA-006: one description of what must pass, rather than
# two files that can drift apart while both stay green. The only
# difference between the two callers is `publish`.
#
# The matrix sits on the CALLING job, deliberately. The gate takes one
# `python-version` by design, because a matrix input would put this
# repository's CI shape inside a hash-pinned kit body. A job that `uses:`
# a reusable workflow may carry its own `strategy.matrix`, so the
# 3.11/3.13 by latest/minimum breadth is preserved rather than collapsed.
# The alternative, calling the gate once beside an unchanged matrix job,
# was rejected: it would leave two places describing what runs, which is
# the thing this promotion exists to reduce.
#
# What each leg now does that it did not before: it builds the wheel and
# smoke-tests it in a clean virtualenv with the source tree absent. That
# is more work per leg and it is the point. Lint and types also move from
# a single 3.12 job to every leg; ruff is pinned exactly (REQ-96) so its
# verdict cannot differ between them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: gate (py${{ matrix.python-version }}, ${{ matrix.deps }} deps)
    # `contents: read` is what the gate's three checkouts need, and it is
    # all this caller grants. It used to grant `id-token: write` as well,
    # not because CI publishes anything but because the gate's `publish`
    # job declared that permission itself, and a called workflow's jobs
    # are validated against the caller's grant when the run STARTS,
    # before any `if:` is evaluated. So a caller passing `publish: false`
    # still had to hold an OIDC credential it had no use for, or die in
    # one second. Kit 0.2.7 removed that declaration so the job inherits,
    # which is `ITC-20260729-0250`; the workaround came out with it.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            deps: latest
            install: pip install -e ".[dev]"
          # NumPy 1.26 has no Python 3.13 wheels, so the minimum floor is
          # exercised on the oldest supported interpreter only.
          - python-version: "3.11"
            deps: minimum
            install: pip install -e ".[dev]" && pip install "numpy==1.26.*" "pandas==2.1.*"
          - python-version: "3.13"
            deps: latest
            install: pip install -e ".[dev]"
    uses: ./.github/workflows/release_gate.yml
    with:
      publish: false
      python-version: ${{ matrix.python-version }}
      install: ${{ matrix.install }}
      version-command: python -c "import itaca.core.version as v; print(v.__version__)"
      identity-checker: .claude/kit/check_version_identity.py
      gates: |
        [
          {"name": "lint", "run": "ruff check . && ruff format --check ."},
          {"name": "types", "run": "mypy"},
          {"name": "tests+coverage(90)", "run": "pytest"}
        ]
      smoke: >-
        $PYTHON -c "import numpy as np, itaca as itc; db =
        itc.load(np.array([[0.0, 1.0], [1.0, 2.0], [2.0, 3.0]]),
        names=['alpha', 'FZ']).pivot(dims=['alpha']).set_uncertainty({'FZ':
        0.1}).compute('CZ = FZ * 2.0'); assert list(db.vars['CZ'].values) ==
        [2.0, 4.0, 6.0], db.vars['CZ'].values; assert
        list(db.uncertainty.systematic['CZ']) == [0.2, 0.2, 0.2],
        db.uncertainty.systematic['CZ']; print('smoke ok', itc.__version__)"

  # ITC-20260730-0010. The authority chain opens with "docs/srs/ is the
  # authoritative specification", and until this job existed nothing built
  # it. `main.log` was dated 2026-07-23 while document versions 0.2.1 and
  # 0.2.2 both shipped after it, each asserting in its own revision history
  # that the document had changed. Two build defects reached main that way
  # and neither was found by a machine: chapter 7 was blank-line doubled
  # (ITC-20260729-2300, four errors) and one unescaped underscore inside
  # \code{} put chapter 8 into math mode that leaked into chapter 9
  # (ITC-20260729-2350, three errors). Seven errors, exit 1, and the only
  # mechanism that ever found either was a person running pdflatex by hand.
  #
  # This is a JOB and not an apparatus, deliberately. It sits outside the
  # matrix because the document does not depend on the Python version, and
  # outside the reusable gate because the gate is a hash-pinned kit body
  # that no repository may edit to add its own document build.
  #
  # It asserts BOTH the exit status and an empty error list, which is this
  # repository's own rule applied to a new checker: "read a checker's entry
  # count and not only its exit code". latexmk in nonstopmode can emit a
  # PDF and still have logged errors, and an 85-page PDF built from a
  # document in math mode is exactly the artifact that looks like a
  # success. Measured before this job was written: the broken tree gives
  # exit 12 with 7 error lines, and the fixed tree exit 0 with 0.
  srs:
    name: SRS builds (latexmk)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # No TeX distribution is present on the runner. The set below is the
      # smallest that covers this document's preamble: newtx lives in
      # fonts-extra, tcolorbox/titlesec/lettrine/enumitem/multirow in
      # latex-extra, and natbib/mathtools/microtype/hyperref in
      # latex-recommended. bibtex-extra is for the natbib run over
      # sample.bib, which latexmk drives on its own.
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-bibtex-extra
      - name: Build the SRS
        working-directory: docs/srs
        run: latexmk -pdf -file-line-error -interaction=nonstopmode main.tex
      - name: Refuse a build that logged errors even after exiting zero
        working-directory: docs/srs
        run: |
          if grep -nE '^(!|[^ ]+:[0-9]+: )' main.log; then
            echo "::error::the SRS build logged LaTeX errors; see the lines above"
            exit 1
          fi
          echo "no LaTeX errors in main.log"
      - name: Show the errors on failure
        if: failure()
        working-directory: docs/srs
        run: |
          grep -nE '^(!|[^ ]+:[0-9]+: )' main.log || true
          echo "----- last 60 lines of main.log -----"
          tail -60 main.log
