# Continuous integration (REQ-95): ruff check, ruff format --check,
# mypy --strict on the public API, pytest with the 90 percent coverage
# gate (REQ-75). Tests run against the minimum and the latest compatible
# dependency versions (REQ-83).
#
# CI and Release now call the SAME reusable gate, which is what REV-001
# asked for in ITACA-006: one description of what must pass, rather than
# two files that can drift apart while both stay green. Since kit 0.2.12
# the gate does not publish at all, so there is no `publish` input to tell
# the two callers apart: what makes release.yml the release path is that it
# carries a publishing job, and what keeps this file off the index is that
# it does not.
#
# The matrix below is checked against release.yml's `breadth` call, entry
# for entry, by `check_release_gate.py` rule 5. A leg added here and not
# there is refused, because it would be a configuration CI proves on main
# and the tag path never proves on the commit being released (FND-070).
#
# The matrix sits on the CALLING job, deliberately. The gate takes one
# `python-version` by design, because a matrix input would put this
# repository's CI shape inside a hash-pinned kit body. A job that `uses:`
# a reusable workflow may carry its own `strategy.matrix`, so the
# 3.11/3.13 by latest/minimum breadth is preserved rather than collapsed.
# The alternative, calling the gate once beside an unchanged matrix job,
# was rejected: it would leave two places describing what runs, which is
# the thing this promotion exists to reduce.
#
# What each leg now does that it did not before: it builds the wheel and
# smoke-tests it in a clean virtualenv with the source tree absent. That
# is more work per leg and it is the point. Lint and types also move from
# a single 3.12 job to every leg; ruff is pinned exactly (DD-29, which
# is what the pin rests on; REQ-96 is the mirror the pin serves) so its
# verdict cannot differ between them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: gate (py${{ matrix.python-version }}, ${{ matrix.deps }} deps)
    # `contents: read` is what the gate's three checkouts need, and it is
    # all this caller grants. It used to grant `id-token: write` as well,
    # not because CI publishes anything but because the gate's `publish`
    # job declared that permission itself, and a called workflow's jobs
    # are validated against the caller's grant when the run STARTS,
    # before any `if:` is evaluated. So a caller passing `publish: false`
    # still had to hold an OIDC credential it had no use for, or die in
    # one second. Kit 0.2.7 removed that declaration so the job inherits,
    # which is `ITC-20260729-0250`; the workaround came out with it. At
    # 0.2.12 the gate has no publish job left to declare anything.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            deps: latest
            install: pip install -e ".[dev]"
          # NumPy 1.26 has no Python 3.13 wheels, so the minimum floor is
          # exercised on the oldest supported interpreter only.
          - python-version: "3.11"
            deps: minimum
            install: pip install -e ".[dev]" && pip install "numpy==1.26.*" "pandas==2.1.*"
          - python-version: "3.13"
            deps: latest
            install: pip install -e ".[dev]"
    uses: ./.github/workflows/release_gate.yml
    with:
      # One artifact name per leg. Artifacts share a single namespace per
      # RUN and are immutable in upload-artifact v4, so the three legs used
      # to collide on the one literal name the gate carried (FND-069).
      artifact-tag: py${{ matrix.python-version }}-${{ matrix.deps }}
      python-version: ${{ matrix.python-version }}
      install: ${{ matrix.install }}
      version-command: python -c "import itaca.core.version as v; print(v.__version__)"
      identity-checker: .claude/kit/check_version_identity.py
      # Resolved from PyPI on 2026-07-30 and kept identical to release.yml's.
      # FND-052: the build step used to run `pip install --upgrade pip build
      # twine`, so the tools that produced every published artifact were
      # whatever the index held that minute.
      build-toolchain: pip==26.2 build==1.5.0 twine==7.0.0
      # The bare `pytest` gate is what makes the `guardproof` marker a
      # routing decision rather than an exemption: it runs EVERYTHING,
      # including the tests the pre-push tier deselects.
      #
      # AN ISOLATED BUDGET GATE BELONGS HERE AND IS NOT ADDED YET. ITA-18
      # vendored `budget_isolation.py`, whose consumer must run alone with
      # `KIT_BUDGET_ISOLATED=1` on that step and nowhere wider. Adding it to
      # this call alone breaks
      # `test_house_style.py::test_every_gate_call_passes_the_same_checks_and_toolchain`,
      # which requires the THREE release-gate calls to carry identical
      # inputs, so it would also have to be added to `release.yml`'s two
      # calls. That is the release path, which ITA-18 was told not to touch.
      # Registered as `ITC-20260812-0030`; do not add it here alone.
      gates: |
        [
          {"name": "lint", "run": "ruff check . && ruff format --check ."},
          {"name": "types", "run": "mypy"},
          {"name": "tests+coverage(90)", "run": "pytest"}
        ]
      smoke: >-
        $PYTHON -c "import numpy as np, itaca as itc; db =
        itc.load(np.array([[0.0, 1.0], [1.0, 2.0], [2.0, 3.0]]),
        names=['alpha', 'FZ']).pivot(dims=['alpha']).set_uncertainty({'FZ':
        0.1}).compute('CZ = FZ * 2.0'); assert list(db.vars['CZ'].values) ==
        [2.0, 4.0, 6.0], db.vars['CZ'].values; assert
        list(db.uncertainty.systematic['CZ']) == [0.2, 0.2, 0.2],
        db.uncertainty.systematic['CZ']; print('smoke ok', itc.__version__)"

  # ITC-20260730-0010, and REQ-95 names it. The build lives in its own
  # itaca-owned reusable so that the RELEASE path gates on it too; the first
  # version of this sat inline here, and a reviewer measured that a tag push
  # therefore never built the document. See srs_build.yml for the reasoning
  # and the measured error decomposition.
  srs:
    permissions:
      contents: read
    uses: ./.github/workflows/srs_build.yml
