# Local CI mirror (REQ-96), in TIERS. Install once:
#
#     pre-commit install
#
# `default_install_hook_types` below is what makes that one line install
# BOTH types. It is not a convenience: without the pre-push hook the commit
# tier runs and the blocking tier does not exist, so the `slow` marker would
# mean "runs nowhere locally", which is strictly worse than what this file
# replaced. Two reviewers measured that a documented two-command install is
# a silent hole, because the missing tier is indistinguishable from a
# passing one; the fix is this key rather than a warning nobody reads.
#
# | tier     | when         | runs                                | budget         |
# |----------|--------------|-------------------------------------|----------------|
# | commit   | every commit | ruff, mypy, the fast test subset    | p95 under 30 s |
# | pre-push | every push   | suite minus guardproof, +cov, mypy  | minutes, once  |
# | PR       | CI           | EVERYTHING, three interpreters      | CI's problem   |
# | release  | tag          | artifact, examples, the full panel  | once           |
#
# WHAT MOVED, AND WHAT DID NOT. Nothing stopped being mandatory, and that
# claim now has to be made twice because two different splits made it.
#
# The `slow` split moved tests off every COMMIT and onto every PUSH, where
# they still block. Whether the full suite stops blocking anywhere is the
# author's gate-policy sitting, not this file's to decide (BRF-063).
#
# The `guardproof` split (2026-08-11, her answer to BRF-076) moved eleven
# tests off the PUSH and into CI, which does NOT block a push. That is a
# weaker claim and it is stated as one: what compensates is that a lane
# closing its work runs `.claude/tools/closing_ci_check.py`, which refuses
# to let the work be reported closed over a red, running or unknown CI.
# That is an instruction with a mechanical ANSWER, not an enforcement that
# a session ran it. See the pytest-full entry.
#
# WHY. The hook below was named `pytest-fast` and ran `pytest -x -q
# --no-cov` with `always_run`, which is the entire suite; the separate
# `mypy` hook ran a full `mypy --strict` beside it. At 49 commits in three
# days that is hours per day paid at the wrong gate (BRF-060, BRF-063).
#
# ONLY THE SUITE HALF MOVED. `mypy` still runs on every commit, unchanged,
# and a reviewer measured that `mypy-full` at pre-push is the byte-identical
# command a second time. Scoping or de-duplicating mypy is registered as
# ITC-20260730-2355, not done here. Measured here on
# 2026-07-30: two modules were essentially all of it, `test_release_integrity`
# at 539 s and `test_push_gate` at 108 s, against 0.7 to 3.9 s for every
# other module. Both are process-level, spawning a checker or a hook per
# case.
#
# Keep the ruff rev below equal to the ruff pin in the pyproject [dev]
# extra; the bump procedure is documented there.
# tests/test_tooling_config.py fails if they drift apart.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      # always_run, because `types: [python]` alone makes pre-commit skip
      # the hook when a commit touches no .py file. A documentation-only
      # or pyproject-only commit therefore ran NEITHER gate, which is
      # exactly the commit most likely to change what the gates check
      # (ITACA-015). pass_filenames stays false: both commands define
      # their own scope.
      - id: mypy
        name: mypy --strict (public API)
        entry: mypy
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      # The COMMIT tier. `-m "not slow or fast"` is what buys the budget; `-x` buys
      # latency on a failing run only and must never be mistaken for the
      # mechanism. The subset FAILS the commit, it does not advise: a fast
      # tier that only warns is the same class as a guard reporting green.
      #
      # `or fast` readmits a test that a MODULE-level slow marker swept out.
      # The marker is applied to a file and cost is a property of a test:
      # measured 2026-08-01, 57 of test_push_gate.py's 60 tests genuinely cost
      # 0.25 to 1.7 s and three cost 0.17 s between them, one of which is the
      # 0.01 s guard lane ITA-11 broke and committed because this gate could
      # not see it. The four readmitted tests cost about 0.6 s together,
      # measured as the sum of their own durations inside this tier; NOT
      # nothing, which is what this comment first claimed. `fast` moves a test
      # INTO this tier and never out of it, and the per-test budget in
      # tests/conftest.py reaches it once it is here.
      - id: pytest-fast
        name: pytest (fast subset, no coverage; pre-push runs the rest, CI runs all)
        entry: pytest -m "not slow or fast" -x -q --no-cov
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      # The BLOCKING tier: the suite minus `guardproof`, coverage floor
      # included, once per push rather than once per commit. Everything the
      # `slow` marker moved out of the commit tier lands here, which is what
      # makes THAT marker a statement about WHERE a test runs and never
      # about whether. What `guardproof` removes lands in CI instead; the
      # entry's own comment below carries that argument and does not repeat
      # it here.
      #
      # WRAPPED IN THE PRE-PUSH RECEIPT (kit 0.2.15). The suite still runs
      # and still blocks; what the wrapper removes is running it a second
      # time on content that already passed it. It computes a key over the
      # working tree by content, the interpreter and every visible
      # distribution, and the command itself, and skips only on an exact
      # match under four hours. EVERY unknown state RUNS: absent, empty,
      # malformed or expired receipt, a changed file, a changed dependency,
      # a different command. A failing run DELETES the receipt, so a tree
      # that passed and then failed carries no authority.
      #
      # It cannot be turned off, deliberately: there is no environment
      # variable that skips it, because the whole point is that
      # `--no-verify` never becomes the cheaper path. `--label` is what
      # keeps two wrapped commands from authorizing each other.
      #
      # `mypy-full` below is NOT wrapped, decided in lane ITA-11: mypy here
      # is seconds rather than minutes, so the receipt buys almost nothing,
      # and ITC-20260730-2355 already registers that this hook is the
      # byte-identical command a second time. Giving that duplicate a
      # mechanism of its own would make the registered item harder to act
      # on, not easier.
      #
      # `-m "not guardproof"` is the ONE narrowing this tier carries, and it
      # is the author's decision of 2026-08-11 answering BRF-076: a push must
      # not be allowed to carry a change that breaks BEHAVIOR, and proving
      # that a guard is well built answers a different question, which only
      # changes when the guard changes. The marker is defined in pyproject
      # with its full reasoning; what belongs here is what it costs and what
      # stands behind it.
      #
      # MEASURED on 2026-08-11 by the coordination level, on the tree BEFORE
      # this lane added its own tests, by running the suite rather than
      # reading the stale figure this file used to carry: 937.17s, 1678
      # passed, and FIVE tests were 718.5s of it. Four are mutation proofs
      # and the fifth asserts that the commit tier is fast, for 25.5s, at
      # the gate the commit tier is not.
      #
      # The "before this lane's own tests" clause is load-bearing, not
      # hedging: this tier now passes MORE tests than that 1678, because the
      # lane added a module. A later figure that looks impossible beside
      # this one is that, and DD-56 carries the reconciliation.
      #
      # NOTHING STOPPED BEING MANDATORY, which is the same sentence the
      # `slow` split earned and this one has to earn separately, because it
      # is a weaker claim: `slow` moves a test to a tier that BLOCKS, and
      # this moves it to one that does not. What compensates is that a lane
      # closing its work runs `.claude/tools/closing_ci_check.py`, which
      # refuses to let the work be reported closed over a red, running or
      # unknown CI (INC-20260811-1745-itaca). Stated at its real strength:
      # that is an instruction whose ANSWER is mechanical, and NOT an
      # enforcement that a session ran it. Nothing here makes a red CI block
      # a push.
      - id: pytest-full
        name: pytest (suite minus guard proofs, with coverage; blocks the push)
        entry: python .claude/kit/prepush_receipt.py guard --label pytest-full -- pytest -m "not guardproof"
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
      - id: mypy-full
        name: mypy --strict (full; blocks the push)
        entry: mypy
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
