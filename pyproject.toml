[build-system]
# The setuptools floor is 77 and not 68 because of the license
# declaration below: PEP 639's `license` SPDX expression and
# `license-files` are understood from 77 onward, and a lower floor would
# let a conforming build environment install a setuptools that silently
# falls back to the legacy free-text metadata (FND-056).
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "itaca"
description = "Integrated Toolkit for Aerospace Computation and Analysis: rigorous engineering data management, analysis, and computation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# PEP 639: an SPDX expression, not the legacy `{ text = "MIT" }` table,
# and `license-files` so the TEXT of the license reaches the artifact
# rather than only its name. A free-text field is not machine-checkable,
# which is the whole reason PEP 639 exists: a downstream redistributor
# has to answer the license question programmatically (FND-056).
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Geovana Neves" }]
keywords = [
    "aerospace",
    "data-management",
    "uncertainty",
    "GUM",
    "provenance",
    "wind-tunnel",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    # No `License ::` classifier: PEP 639 deprecates them in favour of
    # the SPDX expression above, precisely because two declarations of
    # one fact can disagree (FND-056).
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26,<3.0"]
dynamic = ["version"]

# Without these the PyPI project page carries no Source, Changelog or Issues
# link at all, which the release review found while checking that the
# known-open disclosure is reachable. That disclosure is what makes shipping
# with known defects legitimate, and it lived at the bare filename
# `CHANGELOG.md`; the Known open block's own "open an issue" instruction had
# nowhere to point.
[project.urls]
Homepage = "https://github.com/nevesgeovana/itaca"
Source = "https://github.com/nevesgeovana/itaca"
Changelog = "https://github.com/nevesgeovana/itaca/blob/main/CHANGELOG.md"
Issues = "https://github.com/nevesgeovana/itaca/issues"

[project.optional-dependencies]
pandas = ["pandas>=2.1,<3.0"]
dev = [
    # The floor is 9.0.3 and not 8.x because of CVE-2025-71176, pytest's
    # insecure temporary-directory handling on UNIX: /tmp/pytest-of-{user}
    # is predictable, so a local attacker can pre-create it or symlink it
    # before pytest does. The advisory's affected range is `< 9.0.3` and
    # its patched range is `9.0.3` alone, with NO backport to the 8.x
    # series, so the old `>=8.0,<9.0` did not merely exclude the fix: it
    # pinned this project to a vulnerable pytest with no remedy inside
    # its own range. Moderate, CVSS 6.8, and dev-only, which is why this
    # is a floor rise and not an incident.
    "pytest>=9.0.3,<10.0",
    # Moved with pytest, not independently: pytest-cov 5.x predates
    # pytest 9 and does not support it, so the two pins are one decision.
    "pytest-cov>=7.0,<8.0",
    "hypothesis>=6.100,<7.0",
    # Exact pin, bumped deliberately: ruff is the one tool whose version
    # is declared twice, because ruff-pre-commit builds an isolated hook
    # environment, while the mypy and pytest hooks are language: system
    # and inherit whatever this extra installed. A range here let CI and
    # the hook run different rule sets (REQ-96). To bump: move this pin
    # and the ruff rev in .pre-commit-config.yaml, which carries a
    # leading v (rev: vX.Y.Z), in one commit; reinstall with
    # pip install -e ".[dev]" so this environment moves too (pre-commit
    # rebuilds its own hook environment); then run ruff check . and
    # ruff format --check . over the repo and fix what the new rules
    # surface.
    # tests/test_tooling_config.py fails if the two ever drift apart.
    "ruff==0.15.22",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<5.0",
    # Dev-only test oracle for the direction-cosine geometry (DD-26);
    # scipy is never a runtime dependency and is barred from library
    # code by the NumPy-only import policy.
    "scipy>=1.11,<2.0",
    # Dev-only GUM oracle (DD-25), the same posture as scipy above and
    # barred from library code by the same TID251 rule. DD-25 approved it
    # and no dependency group ever listed it, so for two milestones the
    # ruff rule named a package nobody could import and tests/oracle/
    # held the geometry oracle alone: the decision was recorded and never
    # deployed. That gap is why 96 percent line coverage sat beside four
    # confirmed uncertainty defects (BRF-059, gap C).
    "uncertainties>=3.2,<4.0",
    # The vendored kit release-gate checker parses workflow YAML. Without
    # PyYAML it exits 2 having verified NOTHING, rather than degrading to
    # a text scan, so a missing parser would read as an unarmed guard.
    "pyyaml>=6.0,<7.0",
    # The release-integrity tests build a real wheel and sdist, because
    # ITACA-004, ITACA-014 and BRF-048 all live in the ARTIFACT and are
    # invisible to a suite that reads the source tree. Absent here, those
    # tests error on CI, which installs this extra and nothing else: the
    # artifact boundary would not run on the machine that gates the
    # release. This is ITACA-015's class, one tool further out, so
    # tests/test_tooling_config.py now discovers the spawn sites.
    "build>=1.0,<2.0",
    # The contributing guide documents `pip install -e ".[dev]"` and says
    # the extra installs everything the tests need. It did not: a test
    # imports pandas at module scope, so the DOCUMENTED command failed at
    # collection while CI hid it by installing `.[dev,pandas]`
    # (ITACA-015). The separate `pandas` extra above stays, for runtime
    # consumers who want the bridge without the toolchain.
    "pandas>=2.1,<3.0",
]

[tool.setuptools.packages.find]
include = ["itaca*"]

# PEP 561: the marker must be INSIDE the distribution, or the
# `Typing :: Typed` classifier above promises a consumer something the
# installed package does not deliver (ITACA-014). mypy passing over
# this source tree says nothing about that.
[tool.setuptools.package-data]
itaca = ["py.typed"]

# The version is derived from the repository, never written in a file
# (ITACA-004, DD-38). `release-branch-semver` is deliberate and not the
# default: `guess-next-dev` would name 0.1.1.devN, the next PATCH after
# the last tag, while this project ships milestones as minor releases
# (M0 to M3 as v0.1.0 to v0.4.0). On a tagged commit every scheme
# yields exactly X.Y.Z, which is what the release gate requires.
#
# `no-local-version` is required, not cosmetic: the default appends
# `+g<sha>`, which PyPI rejects for upload and which the vendored
# version-identity checker treats as its own separate failure.
[tool.setuptools_scm]
version_scheme = "release-branch-semver"
local_scheme = "no-local-version"
version_file = "itaca/core/_version.py"

# -----------------------------------------------------------------------------
# ruff: linting and formatting (REQ-80), import policy (REQ-82, DD-02)
# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py311"
# Forward-looking: Markdown formatting is preview-only in the pinned
# ruff, so this excludes nothing today. It keeps the formatter's scope
# stable when that graduates, since .md files here are prose and
# illustrative samples, not sources the formatter owns. Revisit if
# Markdown code blocks are ever collected as doctests, which nothing
# in this repository does today.
#
# The vendored shared-process-kit copies under .claude/hooks and
# .claude/kit are excluded: they are derived copies whose body is
# drift-pinned by tests/test_kit_drift.py, so a lint or format fix here
# would break the pinned hash and has no in-repo remedy. Their lint and
# format standard is the kit master's responsibility; a finding against
# one is fixed in the kit and re-vendored, never hand-edited here.
extend-exclude = ["*.md", ".claude/hooks/**", ".claude/kit/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TID", "RUF", "D"]
# D105: magic-method docstrings add noise; their contracts are canonical.
ignore = ["D105"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The ban is repository-wide and NO package is exempt from it. REQ-82's
# exception clause licenses pandas, lazily, in io/ and utils/; it does
# not license xarray or dask anywhere, and exempting those packages
# wholesale was broader than the license on both sides (ITACA-013). A
# licensed pandas import takes a targeted `# noqa: TID251` at its own
# site, so a package added later is restricted by default and each
# exemption is visible in the file that takes it.
"xarray".msg = "NumPy-only rule (REQ-82, DD-02): xarray is barred from every itaca package, with no exception"
"dask".msg = "NumPy-only rule (REQ-82, DD-02): dask is barred from every itaca package, with no exception"
"pandas".msg = "NumPy-only rule (REQ-82, DD-02): pandas is barred from library code except for a lazy import in io/ or utils/, which must carry its own `# noqa: TID251` (REQ-05, REQ-84)"
"scipy".msg = "Dev-only geometry oracle (DD-26): scipy is barred from library code; use it only under tests/oracle/"
"uncertainties".msg = "Dev-only GUM oracle (DD-25): uncertainties is barred from library code; use it only under tests/oracle/"

[tool.ruff.lint.per-file-ignores]
# NO library package is exempt from TID251 any more. REQ-82's exception
# licenses PANDAS, lazily, in io/ and utils/; it does not license xarray
# or dask anywhere. Exempting those packages wholesale was broader than
# the license on both sides, and it was measured: an `import xarray`
# added to itaca/io/ passed ruff AND the AST guard (ITACA-013, proven by
# mutation). The exemption is now granted per IMPORT SITE with a
# targeted `# noqa: TID251`, so each one is visible in the file that
# takes it and a new banned import cannot inherit a package's license.
# tests/** may use anything; it is not a package the AST guard walks.
"tests/**" = ["TID251", "D"]

# -----------------------------------------------------------------------------
# mypy: strict typing on the public API (REQ-78)
# -----------------------------------------------------------------------------

[tool.mypy]
# No python_version pin: NumPy 2.x stubs need the 3.12 grammar. The
# 3.11 floor is exercised by the CI test matrix (REQ-83) and pinned
# against its restatements by tests/test_python_floor.py, not by mypy.
strict = true
files = ["itaca"]

[[tool.mypy.overrides]]
# pandas is an optional, lazily imported bridge (REQ-84); its stubs
# are not a dependency.
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `itaca/core/_version.py` is GENERATED by setuptools-scm at build time
# and gitignored, so it is absent from any tree that has not been built:
# a fresh clone, a detached git worktree, or CI before its install step.
# Without this override `mypy --strict` reports
# `Cannot find implementation or library stub for module named
# "itaca.core._version"` on a perfectly correct tree, which is a stated
# gate failing for a reason the developer did not cause. The standard
# remedy for that noise is a blanket ignore, and that would be a real
# weakening, so the exemption is taken here, scoped to the ONE generated
# module. Measured at 704afc9, before the resolution order changed, so
# this predates that change rather than being caused by it.
# tests/test_tooling_config.py refuses this override if it ever widens.
module = ["itaca.core._version"]
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# pytest and coverage: 90 percent hard gate (REQ-75, REQ-95)
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=itaca --cov-report=term-missing --cov-fail-under=90"
markers = [
  # The COMMIT tier runs `-m "not slow"`. A marked module does not stop
  # being mandatory: the pre-push hook runs the whole suite with coverage
  # and blocks, and CI runs it on every pull request. What the marker
  # changes is WHERE it runs, never WHETHER.
  #
  # Measured 2026-07-30 on the tree that introduced this, with --no-cov:
  # test_release_integrity.py 539 s and test_push_gate.py 108 s, against
  # 0.7 to 3.9 s for every other module in the suite. Two modules were
  # essentially the whole commit gate. Both are process-level: they spawn
  # a hook or a checker per case and build real sdists and wheels.
  #
  # Do not mark a test slow to make a red commit green. The per-test
  # budget in tests/conftest.py is what keeps the subset fast, and
  # tests/test_tooling_config.py refuses a marker on the contract modules
  # the commit tier must keep.
  "slow: process-level; runs at pre-push and in CI, not at commit time",
]

[tool.coverage.run]
branch = true
source = ["itaca"]
